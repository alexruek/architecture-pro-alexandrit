apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplest
  labels:
    app: simplest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simplest
  template:
    metadata:
      labels:
        app: simplest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.52
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 14268
          name: http-collector
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: simplest-query
spec:
  selector:
    app: simplest
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: simplest-collector
spec:
  selector:
    app: simplest
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
